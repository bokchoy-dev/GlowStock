<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowStock - Makeup Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>💄 GlowStock</h1>
        <div class="sync-controls">
            <button id="openFormBtn" class="btn-primary">➕ Add Product</button>
            <button id="exportBtn" class="btn-secondary">📤 Export JSON Data</button>
        </div>
    </header>

    <main>
        <!-- Controls Section -->
        <section class="controls-section">
            <input type="text" id="searchBar" placeholder="Search brand, product, or color...">
            
            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>

            <!-- Updated Status Filter with Brand New option -->
            <select id="statusFilter">
                <option value="all">All Statuses</option>
                <option value="Brand New">Brand New</option>
                <option value="In Use">In Use</option>
                <option value="Used Up">Used Up</option>
            </select>

            <button id="sortDateBtn" class="btn-filter">Sort by Date ↕</button>
            <button id="sortPriceBtn" class="btn-filter">Sort by Price ↕</button>

            <label class="hide-used-label">
                <input type="checkbox" id="hideUsedCheck"> Hide Used Up
            </label>
        </section>

        <!-- Product Grid -->
        <section id="productGrid" class="product-grid"></section>
    </main>


    <!-- Detail & Edit Modal -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close-button">&times;</span>
            <h2>Edit Product Details</h2>
            <div class="modal-body">
                <img id="modalImage" src="" alt="Product Image">
                <form id="editProductForm">
                    <div class="form-group row-inputs">
                        <div>
                            <label>Brand Name</label>
                            <input type="text" id="modalBrandInput" required>
                        </div>
                        <div>
                            <label>Product Name</label>
                            <input type="text" id="modalNameInput" required>
                        </div>
                    </div>
                    <div class="form-group row-inputs">
                        <div>
                            <label>Category</label>
                            <select id="modalCategorySelect"></select>
                        </div>
                        <div>
                            <label>Color / Shade</label>
                            <input type="text" id="modalColorInput">
                        </div>
                    </div>
                    <div class="form-group row-inputs">
                        <div>
                            <label>Size / Volume</label>
                            <input type="text" id="modalSizeInput">
                        </div>
                        <div>
                            <label>Purchase Date</label>
                            <input type="date" id="modalDateInput" required>
                        </div>
                    </div>
                    <!-- Updated Row: Added Cost (HKD$) to Edit Form -->
                    <div class="form-group row-inputs">
                        <div>
                            <label>Cost (HKD$)</label>
                            <input type="number" id="modalCostInput" min="0" step="any" placeholder="HKD$">
                        </div>
                        <div>
                            <label>Status</label>
                            <select id="modalStatusSelect">
                                <option value="Brand New">Brand New</option>
                                <option value="In Use">In Use</option>
                                <option value="Used Up">Used Up</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Rating</label>
                        <select id="modalRatingSelect">
                            <option value="5">⭐⭐⭐⭐⭐</option>
                            <option value="4">⭐⭐⭐⭐</option>
                            <option value="3">⭐⭐⭐</option>
                            <option value="2">⭐⭐</option>
                            <option value="1">⭐</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description / Notes</label>
                        <textarea id="modalDescriptionInput" rows="3"></textarea>
                    </div>
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="button" id="modalDeleteBtn" class="btn-secondary" style="background-color: #ff4757; flex: 1;">🗑️ Delete Item</button>
                            <button type="submit" class="btn-primary" style="flex: 2;">Save Changes</button>
                        </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Form Modal (Add Product) -->
    <div id="formModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeFormModal" class="close-button">&times;</span>
            <h2>Add New Makeup Item</h2>
            <form id="addProductForm">
                <div class="form-group row-inputs">
                    <div>
                        <label>Brand Name *</label>
                        <input type="text" id="prodBrand" placeholder="e.g., Chanel, Dior" required>
                    </div>
                    <div>
                        <label>Product Name *</label>
                        <input type="text" id="prodName" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <div style="display: flex; gap: 5px;">
                        <select id="prodCategory" required></select>
                        <button type="button" id="addNewCategoryBtn" class="btn-secondary" style="padding: 5px 10px;">➕ New</button>
                    </div>
                </div>
                <div class="form-group row-inputs">
                    <div>
                        <label>Color / Shade</label>
                        <input type="text" id="prodColor">
                    </div>
                    <div>
                        <label>Size / Volume</label>
                        <input type="text" id="prodSize">
                    </div>
                </div>
                <!-- Updated Row: Added Cost (HKD$) to Creation Form -->
                <div class="form-group row-inputs">
                    <div>
                        <label>Purchase Date *</label>
                        <input type="date" id="prodDate" required>
                    </div>
                    <div>
                        <label>Cost (HKD$)</label>
                        <input type="number" id="prodCost" min="0" step="any" placeholder="HKD$">
                    </div>
                </div>
                <div class="form-group">
                    <label>Initial Status</label>
                    <select id="prodStatus">
                        <option value="Brand New">Brand New</option>
                        <option value="In Use">In Use</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Product Picture</label>
                    <input type="file" id="prodImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Rating (1-5 Stars)</label>
                    <select id="prodRating">
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description / Notes</label>
                    <textarea id="prodDesc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Save to Inventory</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
